  description: "Academic homepage of Youxiang Jiang, a psychometric researcher."
  site-url: "https://jiangyouxiang.github.io"
  navbar:
    background: "#ffffff"
    foreground: "#1f2933"
    title: "Youxiang Jiang"
    collapse-below: md
    left:
      - text: "About / 关于"
        href: "#about"
      - text: "Research / 研究"
        href: "#research"
      - text: "Education / 教育经历"
        href: "#education"
      - text: "Publications / 论文"
        href: "#publications"
